    <style>

        body {
            background-color: #EAF3F2;
            color: #183B4E;
            font-family: Arial, sans-serif;
        }

        .caja1 {
            min-height: 130px;
            background-color: #183B4E;
        }

        .caja2 {
            min-height: 300px;
            background-color: #227C83;
        }

        .caja3 {
            min-height: 300px;

        }

        .caja4 {
            min-height: 300px;

        .caja7 {

            min-height: 300px;

        .caja9 {

        }

        .icono {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .menu-item {
            flex: 0 1 210px;
            min-width: 0;
        }

        .imagen-codigo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-menu {
            color: white;
            border: 2px solid #A8D5BA;
            border-radius: 0;
            padding: 10px 15px;
            background-color: transparent;
            transition: 0.3s;
        }

        .btn-menu:hover {
            background-color: #A8D5BA;
            color: #183B4E;
        }

        @media (max-width: 575.98px) {

            .caja1 {
                gap: 12px !important;
            }

            .menu-item {
                flex: 1 1 calc(50% - 12px);
            }

            .btn-menu {
                width: 100%;
                min-height: 48px;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 8px;
                font-size: 0.85rem;
            }
        }

        @media (min-width: 576px) and (max-width: 1024px) {

            .menu-item {
                flex: 1 1 calc(50% - 16px);
                max-width: 260px;
            }
        }

        @media (min-width: 768px) and (max-width: 1024px) {

            .imagen-codigo {
                display: none;
            }
        }

    </style>
</head>
